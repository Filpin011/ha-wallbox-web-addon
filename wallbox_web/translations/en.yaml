configuration:
  log_level:
    name: Log level
    description: How much detail to write to the add-on log ("debug" also logs the Modbus traffic).
  app_url:
    name: Address of the web app
    description: >-
      Address you use to open Wallbox WEB outside the Home Assistant sidebar, e.g. http://192.168.1.10:8423 or
      your https address behind a reverse proxy. Empty = http://<Home Assistant IP>:<port>. Passkeys only work
      on an https address.
  trusted_origins:
    name: Other addresses
    description: Further addresses (comma separated) allowed to sign in, e.g. http://homeassistant.local:8423.
  discovery_static:
    name: Stations outside this network
    description: >-
      Stations that cannot be discovered automatically (another subnet, VPN): comma separated "ip" or "ip:port",
      e.g. 192.168.20.15,10.0.0.7:333.
  ha_admin_sync:
    name: Home Assistant administrators are app administrators
    description: >-
      Home Assistant users that open the app from the sidebar are signed in automatically. When on, Home Assistant
      administrators get the app's administrator role and other users the normal role.
  reset_admin_password:
    name: Reset the administrator password
    description: >-
      At the next start a new password for "root" is printed in the log. Turn it off again right after the
      restart, otherwise the password changes at every start.
network:
  8423/tcp: Web app in the local network (login, phone app, API for the Home Assistant integration)
